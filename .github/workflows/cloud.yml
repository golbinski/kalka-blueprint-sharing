# Once a day, check that the public PeerJS cloud still relays kalka's
# signaling (docs/peerjs.md): a change upstream would otherwise show only
# when someone tries the cloud mode. Nothing here builds or publishes.
name: PeerJS cloud

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: go test -count=1 -run TestCloudRelay ./internal/peerjs
        env:
          KALKA_CLOUD_TEST: '1'
