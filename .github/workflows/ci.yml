# The checks run before every milestone commit: the web UI's types, tests
# and build; go vet for every system and the desktop build; the Go tests
# with the race detector, and the desktop shell's tests, on Linux, macOS
# and Windows.
#
# No test registers a URL scheme or writes a real login entry (the smoke
# test sets KALKA_NO_URL_SCHEME and marks start at login as set up). Tests
# that reach the public PeerJS cloud or GitHub stay off: they need
# KALKA_CLOUD_TEST or KALKA_GH_LIVE.
#
# A v* tag also builds the release archives (tools/release) into a draft
# GitHub release once every check has passed, adds Kalka.app, then signs
# SHA256SUMS with the release key, attests the build provenance of every
# file and publishes the release (SECURITY.md). Actions are pinned to
# commits; Dependabot proposes updates.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx --no-install tsc --noEmit -p .
      - run: npx --no-install vitest run
      - run: npm run build
      # The Go tests serve the built page (internal/ui embeds it).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-dist
          path: internal/ui/dist
          include-hidden-files: true
          retention-days: 1

  vet:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: go vet, every system
        run: |
          for os in linux darwin windows; do
            echo "== GOOS=$os"
            GOOS=$os go vet ./...
          done
      - name: go vet, the Windows desktop shell (pure Go)
        run: GOOS=windows go vet -tags desktop ./cmd/kalka-desktop ./internal/desktop
      # Known vulnerabilities in the code kalka calls, the standard library's
      # included, fail the build.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  test:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-dist
          path: internal/ui/dist
      - name: Desktop libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev xvfb dbus
          # WebKit's sandbox (bubblewrap) needs unprivileged user namespaces,
          # which Ubuntu 24.04 restricts by default; desktops allow them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: go vet, desktop
        run: go vet -tags desktop ./cmd/kalka-desktop ./internal/desktop
      - name: go test -race
        run: go test -race -count=1 ./...
      - name: Desktop shell tests
        if: runner.os != 'Linux'
        run: go test -tags desktop -count=1 ./cmd/kalka-desktop ./internal/desktop
      - name: Desktop shell tests (Linux, virtual display)
        if: runner.os == 'Linux'
        # A session bus as well as a display, as on a desktop. No tray host
        # runs here, so the shell logs that the tray failed and goes on.
        env:
          GTK_A11Y: none
        run: dbus-run-session -- xvfb-run -a go test -tags desktop -count=1 ./cmd/kalka-desktop ./internal/desktop

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web, vet, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-dist
          path: internal/ui/dist
      # NSIS for the Windows installer; GTK 4 and WebKitGTK for the Linux
      # desktop package. Kalka.app needs a Mac: release-mac adds it below.
      - name: Packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nsis libgtk-4-dev libwebkitgtk-6.0-dev
      - run: go run ./tools/release -version "${GITHUB_REF_NAME#v}"
      # A draft: the updater lists published releases only, so nobody sees
      # the release before publish has signed it. A version with a hyphen
      # (v0.1.0-rc1) becomes a pre-release.
      - run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --draft --title "$GITHUB_REF_NAME" --generate-notes $pre
        env:
          GH_TOKEN: ${{ github.token }}

  # Kalka.app needs a Mac (cgo). It joins the draft the job above made:
  # the app zips are uploaded and SHA256SUMS gets their lines, so the
  # updater (spec 24) can verify them like every other package.
  release-mac:
    needs: release
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-dist
          path: internal/ui/dist
      - run: go run ./tools/release -version "${GITHUB_REF_NAME#v}" -targets darwin/arm64,darwin/amd64 -out dist-mac
      - name: Upload the app zips and add them to SHA256SUMS
        run: |
          set -eu
          gh release download "$GITHUB_REF_NAME" -p SHA256SUMS -D sums
          grep '_darwin_.*_app\.zip$' dist-mac/SHA256SUMS >> sums/SHA256SUMS
          LC_ALL=C sort -k2 -o sums/SHA256SUMS sums/SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" dist-mac/*_app.zip sums/SHA256SUMS --clobber

  # The last step of a release: SHA256SUMS, now complete, is signed with the
  # release key (SHA256SUMS.minisig; the updater refuses a release without
  # it), every file it lists gets a build provenance attestation, and the
  # draft is published. The key is a secret of the release environment,
  # which only v* tags may use.
  publish:
    needs: release-mac
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Download the release's files
        run: gh release download "$GITHUB_REF_NAME" -D dist
      - name: Check every file against SHA256SUMS
        run: |
          set -eu
          cd dist
          sha256sum -c SHA256SUMS
          # Every file is listed, and every listed file is there.
          awk '{sub(/^\*/, "", $2); print $2}' SHA256SUMS | LC_ALL=C sort > ../listed
          ls | grep -vx SHA256SUMS | LC_ALL=C sort > ../held
          diff ../listed ../held
      - name: Sign SHA256SUMS
        run: go run ./tools/sign -tag "$GITHUB_REF_NAME" dist/SHA256SUMS
        env:
          KALKA_RELEASE_KEY: ${{ secrets.KALKA_RELEASE_KEY }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Upload the signature and publish
        run: |
          set -eu
          gh release upload "$GITHUB_REF_NAME" dist/SHA256SUMS.minisig
          gh release edit "$GITHUB_REF_NAME" --draft=false
